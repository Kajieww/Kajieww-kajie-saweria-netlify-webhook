<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kajie Saweria Webhook</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="titlebar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="bar-title">Kajie Saweria Control</span>
      </div>

      <div class="hero">
        <div>
          <p class="eyebrow">NETLIFY WEBHOOK</p>
          <h1>Trigger Saweria ke Roblox</h1>
          <p class="desc">Kirim test Rupiah, FX donation, dan daily board langsung dari website Netlify.</p>
        </div>
        <div class="status" id="healthStatus">Checking...</div>
      </div>

      <form id="triggerForm" class="form">
        <label>PIN Admin</label>
        <input name="pin" type="password" placeholder="ADMIN_PIN" autocomplete="off" required />

        <label>Nama Player / Donor</label>
        <input name="targetName" placeholder="SIKAJIEE" required />

        <label>Jumlah Rupiah</label>
        <input name="amount" id="amountInput" inputmode="numeric" placeholder="50000" required />

        <div class="quick">
          <button type="button" data-amount="50000">50K Nuke</button>
          <button type="button" data-amount="250000">250K Smite</button>
          <button type="button" data-amount="500000">500K Legend</button>
        </div>

        <label>Pesan</label>
        <textarea name="message" placeholder="Test donation dari Netlify"></textarea>

        <button class="submit" type="submit">TRIGGER SAWERIA</button>
      </form>

      <pre id="result" class="result">Siap test.</pre>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
