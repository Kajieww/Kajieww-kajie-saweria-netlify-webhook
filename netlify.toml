[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm run build"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/trigger"
  to = "/.netlify/functions/trigger"
  status = 200

[[redirects]]
  from = "/api/saweria"
  to = "/.netlify/functions/saweria"
  status = 200

[[redirects]]
  from = "/api/webhook"
  to = "/.netlify/functions/saweria"
  status = 200

[[redirects]]
  from = "/webhook/saweria"
  to = "/.netlify/functions/saweria"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
